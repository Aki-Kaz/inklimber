<script>
let H=720;const W=480,TOP=-3600,OFF=4200,T=16,FONT='system-ui,"Hiragino Sans","Noto Sans JP",sans-serif',cv=document.getElementById('c'),ctx=cv.getContext('2d'),mt=document.getElementById('mt');
const pc=document.createElement('canvas');pc.width=W;pc.height=OFF+260;const px=pc.getContext('2d');

let S=1,fc=0;

// スマホ縦持ち: 画面幅いっぱい・縦は端末の縦横比に合わせて伸ばし(H=720〜1000)、余りが出ても上下中央に置く

 const bw=document.body.clientWidth,bh=document.body.clientHeight,ph=TOUCH()&&bh>0&&bw/bh<1.25;
 root.classList.toggle('ph',ph);
 if(ph){H=Math.round(Math.max(720,Math.min(1000,W*bh/bw)));const cw=Math.min(bw,bh*W/H);root.style.setProperty('--cw',cw+'px');root.style.setProperty('--ch',(cw*H/W)+'px')}
 else H=720;

}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,250));
let P,E,I,J,D,pl,st='title',cam,falls=0,best=0,time=0,ink=2,last=0,hm=0,cpY=0,cpX=W/2,cpN=0,fl=0,jq=0;
// 演出用の状態: 波紋/パーティクル/リング/ポップアップ/ヒットストップ/シェイク/コンボ
const HK='white-climb-hint-throw';let seen=0,hintT=-1,newRec=0;try{seen=+localStorage.getItem(HK)||0}catch(e){}
// スコア保存(ブラウザごと): t=最短クリアタイム m=最高到達m
const SK='white-climb-score';let rec={t:0,m:0};try{rec=Object.assign(rec,JSON.parse(localStorage.getItem(SK))||{})}catch(e){}
function showRec(){const t=rec.m>0?'最高 '+rec.m+'m'+(rec.t?'　ベスト '+rec.t.toFixed(1)+'s':''):'まだ記録なし';document.querySelectorAll('.rec').forEach(e=>e.textContent=t)}
function saveRec(){try{localStorage.setItem(SK,JSON.stringify(rec))}catch(e){}showRec()}
let RP=[],Q=[],G=[],F=[],hs=0,shake=0,combo=0,comboT=0,chain=0,found=0,blind=0,mute=0,AC,mg,NB,bgm,musT=0,musStep=0,musTr=0;
// 合目・ベースキャンプ: hm=到達した最高の合目 / cpY,cpX=最後に旗を立てた足場 / cpN=旗の数 / fl=節目のフラッシュ

/* ---------- 効果音 (WebAudioで生成。素材ファイル不要) ---------- */
function au(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.6;bgm=AC.createGain();bgm.gain.value=.5;bgm.connect(mg);
  const cp=AC.createDynamicsCompressor();mg.connect(cp);cp.connect(AC.destination)}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume();
}
['pointerdown','keydown','touchend','click'].forEach(t=>addEventListener(t,au,{passive:true}));
function setMute(v){mute=v;mt.textContent=mute?'×':'♪'}
mt.addEventListener('click',()=>setMute(mute?0:1));
function tone(f,d,ty,v,f2,dl){
 if(!AC||mute)return;
 const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();
 o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fc){
 if(!AC||mute)return;
 if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=NB;f.type='bandpass';f.frequency.value=fc||1000;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.02);
}
// ペンタトニックの音階: n段目の周波数(どれだけ重ねても濁らない)
const SC=[0,2,4,7,9],pen=(n,b)=>{n=Math.max(0,Math.min(14,n|0));return(b||330)*Math.pow(2,(Math.floor(n/5)*12+SC[n%5])/12)};
const sfx={
 jump(){tone(280,.12,'square',.04,560)},
 throw(){tone(520,.1,'triangle',.1,220);noise(.06,.05,2500)},
 empty(){tone(110,.05,'square',.05)},
 splash(c){const f=pen(c,262);noise(.14,.16,1600);tone(f,.2,'triangle',.18);tone(f*2,.14,'sine',.08,0,.03)},
 land(){tone(140,.07,'sine',.07,70)},
 found(){tone(pen(5,262),.1,'sine',.16);tone(pen(7,262),.14,'sine',.14,0,.06)},
 blind(){[0,2,4,7].forEach((n,i)=>tone(pen(n+5,262),.16,'triangle',.16,0,i*.05));noise(.2,.08,5000)},
 stomp(c){const f=pen(c+2,220);tone(f,.12,'square',.08,f*1.5);tone(90,.12,'sine',.18,45)},
 item(){tone(880,.07,'sine',.13,1320)},
 hit(){noise(.2,.25,400);tone(160,.25,'sawtooth',.13,60)},
 thud(){tone(90,.25,'sine',.3,35);noise(.15,.15,300)},
 clear(){for(let i=0;i<8;i++)tone(pen(i,262),.3,'triangle',.16,0,i*.07);tone(pen(7,262)*2,.6,'sine',.12,0,.6)},
 peak(n){tone(pen(n,262),.25,'triangle',.15);tone(pen(n+2,262),.32,'sine',.11,0,.08)},
 camp(){[0,2,4,7,9].forEach((n,i)=>tone(pen(n+3,262),.22,'triangle',.15,0,i*.06));noise(.25,.08,4500)}
};
/* ---------- 振動 (SEと同時。Androidはvibrate、iPhoneはSafariのスイッチ部品の触覚を利用。消音と連動) ---------- */
const HAS_VIB=typeof navigator.vibrate==='function',IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
 HX=document.createElement('label');
HX.setAttribute('aria-hidden','true');HX.style.cssText='position:fixed;left:-60px;top:-60px;width:40px;height:40px;opacity:0;pointer-events:none';HX.innerHTML='<input type="checkbox" switch>';
if(!HAS_VIB&&IOS)document.body.appendChild(HX);
function vib(p){if(mute||!TOUCH())return;try{if(HAS_VIB)navigator.vibrate(p);else if(IOS){HX.click();if(Array.isArray(p)&&p.length>2)setTimeout(()=>HX.click(),70)}}catch(e){}}
const VB={jump:10,throw:12,splash:20,land:10,found:15,blind:[25,40,25],stomp:30,item:10,hit:70,thud:80,clear:[40,40,40,40,100],peak:30,camp:[30,40,30,40,60]};
for(const n in VB){const f=sfx[n];sfx[n]=(...a)=>{f(...a);vib(VB[n])}}

/* ---------- BGM (WebAudioで生成。登るほど楽器が増え、落ちると減る) ---------- */
const CH=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]]; // Am-F-C-G の和音(ペンタトニック寄りで濁らない)
function mt2(f,t,d,ty,v,a){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(a||.01));g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(bgm);o.start(t);o.stop(t+d+.05)}
function mn(t,d,v,fc,hp){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=hp?'highpass':'bandpass';f.frequency.value=fc;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(bgm);s.start(t);s.stop(t+d+.02)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
 g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(bgm);o.start(t);o.stop(t+.2)}
function musNote(s,t){
 const lv=Math.min(10,Math.floor(Math.max(0,-pl.y)/360)),i=s%16,bar=Math.floor(s/16)%4,ch=CH[bar];
 if(i===0&&bar===0)musTr=lv>=6?2:0; // 6合目以上は曲全体が少し明るくなる
 const f=n=>220*Math.pow(2,(n+musTr)/12);
 if(i===0)for(const n of ch)mt2(f(n),t,2.1,'triangle',.06,.3);        // 和音のパッド(常時)
 if(i%4===0)mt2(f(ch[0]-12),t,.45,'sine',.24);                          // ベース(常時)
 if(lv>=1&&i%2===0)mt2(f(ch[(i>>1)%3]+12),t,.4,'triangle',.08);         // 1合目〜: アルペジオ
 if(lv>=3){if(i%4===0)kick(t);if(i%4===2)mn(t,.05,.05,7000,1)}          // 3合目〜: キックとハイハット
 if(lv>=5&&i%4===3)mt2(f(ch[(i>>2)%3]+24),t,.25,'sine',.045);           // 5合目〜: きらめき
 if(lv>=7&&i%8===0)mt2(f([ch[2],ch[1],ch[0],ch[1]][(s>>3)%4]+24),t,.9,'triangle',.07,.02); // 7合目〜: リード
 if(lv>=9&&i%8===4)mn(t,.12,.09,2400);                                  // 9合目〜: スネア
}
function musTick(){
 if(!AC||!bgm)return;
 if(mute||st!=='play'){musT=0;return}
 if(!musT){musStep=0;musT=AC.currentTime+.1;bgm.gain.cancelScheduledValues(0);bgm.gain.setValueAtTime(0,AC.currentTime);bgm.gain.linearRampToValueAtTime(.5,AC.currentTime+1.5)}

 while(musT<AC.currentTime+.25){musNote(musStep++,musT);musT+=.134}
}
setInterval(musTick,60);

/* ---------- 演出ヘルパー ---------- */
function burst(x,y,h,n,sp,g,s){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random()*.7);
 Q.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,l:0,m:.4+Math.random()*.5,h:h+(Math.random()-.5)*50,s:(s||3)+Math.random()*3,g:g===undefined?900:g})}}
function dust(x,y,n){for(let i=0;i<n;i++)Q.push({x:x+(Math.random()-.5)*12,y:y-1,vx:(Math.random()-.5)*90,vy:-20-Math.random()*40,l:0,m:.3,s:3,g:200,c:'#8a90a0'})}
// 文字ではなくアイコンで知らせるポップアップ(ic: star/drop/chev/flag, n: 個数)
function pop(ic,x,y,h,n){F.push({ic,x:Math.max(40,Math.min(W-40,x)),y,h,n:n||1,t:0,d:.9})}
// 汎用アイコン描画(o=true で輪郭のみ)
function icon(t,x,y,s,c,o){
 ctx.save();ctx.translate(x,y);ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=Math.max(1.6,s*.22);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 if(t==='drop'){ctx.moveTo(0,-s);ctx.bezierCurveTo(s*.9,-s*.1,s*.8,s*.9,0,s*.9);ctx.bezierCurveTo(-s*.8,s*.9,-s*.9,-s*.1,0,-s);ctx.closePath();if(o)ctx.stroke();else ctx.fill()}
 else if(t==='star'){for(let i=0;i<8;i++){const r=i%2?s*.3:s,a=i*Math.PI/4-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();if(o)ctx.stroke();else ctx.fill()}
 else if(t==='chev'){ctx.moveTo(-s,s*.4);ctx.lineTo(0,-s*.4);ctx.lineTo(s,s*.4);ctx.stroke()}
 else if(t==='down'){ctx.moveTo(0,-s);ctx.lineTo(0,s*.7);ctx.moveTo(-s*.65,s*.05);ctx.lineTo(0,s*.75);ctx.lineTo(s*.65,s*.05);ctx.stroke()}
 else if(t==='flag'){ctx.moveTo(-s*.5,s);ctx.lineTo(-s*.5,-s);ctx.lineTo(s*.85,-s*.45);ctx.lineTo(-s*.5,.05*s);if(o){ctx.stroke()}else{ctx.fill();ctx.stroke()}}

}
function ring(x,y,h,m,lw){G.push({x,y,h,m,lw,t:0,d:.45})}

const mk=(x,y,w)=>({x,y,w,n:w/T,t:new Array(w/T).fill(0)});
let seed=7;
function init0(){
 const r=rng(seed);P=[mk(0,0,W)];P[0].t.fill(1);E=[];I=[];J=[];D=[];RP=[];Q=[];G=[];F=[];px.clearRect(0,0,pc.width,pc.height);
 let cx=W/2,y=0,ci=0,al=1,secOn=0,gap=0;const CP=[5].map(n=>-n*360); // 5合目(中間地点)にだけベースキャンプ
 while(y>TOP+80){const sec=y<-3330; // 9.5合目あたり〜頂上手前: 細い足場がジグザグに3つ、敵もいない=インクで探す
  y-=(sec?66:60)+r()*(sec?18:26);let w=Math.round((sec?64+r()*32:90+r()*70)/T)*T;const cp=ci<CP.length&&y<=CP[ci];
  if(cp){y=CP[ci++];w=192}
  if(sec&&!cp){al=-al;cx=W/2+al*(30+r()*45)}else cx=Math.min(W-w/2-8,Math.max(w/2+8,cx+(r()-.5)*300));
  const p=mk(Math.round((cx-w/2)/T)*T,y,w);if(cp)p.cp=1;else if(!sec&&r()<.45)p.k=(r()<.5?-1:1)*(.1+r()*.2);
  if(sec&&!secOn){secOn=1;const lp=P[P.length-1];lp.rf=1;refill(lp);} // 手前の足場に補給用インク
  P.push(p);
  let en=0;if(!cp&&!sec&&y<-100){if(w>=112&&r()<.55)en=1;else if(gap>=2&&w>=96)en=2} // 敵なしが2枚続いたら必ず置く
  if(en){E.push({p,x:p.x+w/2,d:en===1?(r()<.5?-1:1):1,alive:1,y:p.y});gap=0}else gap++;}
 P.push(mk(96,TOP,288));
 pl={x:W/2,y:0,vx:0,vy:0,on:1,face:1,coy:0,inv:0,kb:0,minY:0,sq:0,hang:0,hangT:0,noGrab:0};
 cam=-(H-120);ink=2;time=0;hintT=-1;falls=0;hs=0;shake=0;combo=0;comboT=0;chain=0;found=0;blind=0;hm=0;cpY=0;cpX=W/2;cpN=0;fl=0;
}
const surf=(p,x)=>p.y+(p.k||0)*(x-p.x-p.w/2); // 足場の表面の高さ(傾きk対応)
function refill(p){for(let i=0;i<4;i++){const ix=p.x+p.w/2+(i-1.5)*18;I.push({x:ix,y:surf(p,ix)-14,t:i})}} // 補給用インク
// 隣り合う足場が必ずジャンプで届く距離か検査。届かない配置は作り直し(難易度を保ったまま毎回違うステージにする)
function okWorld(){for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],d=Math.max(0,surf(a,a.x+a.w/2)-surf(b,b.x+b.w/2)),g=Math.max(0,b.x-(a.x+a.w),a.x-(b.x+b.w));
 if(d>=92||g>170*(530+Math.sqrt(530*530-2800*d))/1400-14)return false}return true}
function init(){seed=(Math.random()*1e9)|0;for(let i=0;i<80;i++){init0();if(okWorld())break;seed++}}
function paint(p,i){if(i<0||i>=p.n||p.t[i])return 0;p.t[i]=1;p.c=(p.c||0)+1;const h=hue(p.y),x=p.x+i*T,a=surf(p,x)+OFF,b=surf(p,x+T)+OFF;
 px.fillStyle=`hsla(${h},90%,60%,.25)`;px.beginPath();px.moveTo(x-3,a-8);px.lineTo(x+T+3,b-8);px.lineTo(x+T+3,b+14);px.lineTo(x-3,a+14);px.fill();
 px.fillStyle=`hsl(${h},85%,52%)`;px.beginPath();px.moveTo(x,a);px.lineTo(x+T,b);px.lineTo(x+T,b+6);px.lineTo(x,a+6);px.fill();return 1}

// 着弾: 塗りは「波紋」として広がる(fxで処理)。ヒットストップ+シェイク+飛沫+音
function splash(x,y){
 combo++;comboT=1.4;
 const h=hue(y)+Math.random()*30;
 for(let i=0;i<10;i++){px.fillStyle=`hsla(${h+Math.random()*50},90%,58%,.75)`;px.beginPath();
  px.arc(x+(Math.random()-.5)*56,y+OFF+(Math.random()-.5)*30,5+Math.random()*11,0,7);px.fill();}
 RP.push({x,y,r:10,h,n:0});
 for(let i=0;i<6;i++)D.push({x:x+(Math.random()-.5)*50,y:y+2,vy:0,h,len:0});
 burst(x,y-2,h,18,260,900,3);ring(x,y,h,50,3);
 sfx.splash(combo-1);hs=Math.max(hs,.05);shake=Math.max(shake,5);
}
// 初めて踏んだ足場への着地
function land(p,v){
 chain=0;pl.sq=.14;sfx.land();dust(pl.x,pl.y,4);
 if(p.rf&&ink<4&&!I.some(i=>Math.abs(i.y-p.y)<80))refill(p); // 最終エリア手前: インクが尽きても詰まないよう再補給
 if(p===P[0]||p===P[P.length-1]||p.land)return;
 p.land=1;found++;
 const known=p.t.some(Boolean),i=Math.max(0,Math.min(p.n-1,Math.floor((pl.x-p.x)/T))),h=hue(p.y);
 paint(p,i); // 踏んだ場所に足跡が付く
 if(p.cp){ // ベースキャンプ到達: 足場全体が色づき、旗が立つ
  cpY=p.y;cpX=p.x+p.w/2;cpN++;p.act=1;for(let j=0;j<p.n;j++)paint(p,j);
  for(let j=0;j<3;j++)ring(pl.x,pl.y,h+j*40,70+j*45,3);
  burst(pl.x,pl.y-10,h,40,380,500,4);pop('flag',pl.x,pl.y-46,h,1);sfx.camp();hs=Math.max(hs,.08);shake=Math.max(shake,7);fl=.6;return}
 if(known){ring(pl.x,pl.y,h,46,2);sfx.found();shake=Math.max(shake,2)}
 else{blind++;ring(pl.x,pl.y,h,90,4);ring(pl.x,pl.y,h+60,60,2);burst(pl.x,pl.y-2,h,26,320,700,3);sfx.blind();
  pop('star',pl.x,pl.y-34,h,3);hs=Math.max(hs,.07);shake=Math.max(shake,6)}
}
function celebrate(){
 sfx.clear();burst(pl.x,pl.y-20,hue(pl.y),60,420,500,4);
 for(let i=0;i<5;i++)ring(pl.x,pl.y,i*70,60+i*40,3);
 hs=.08;shake=7;
}
function throwInk(dx,dy){
 if(st!=='play')return;
 if(ink<=0){sfx.empty();return}
 if(dx===undefined){dx=pl.face;dy=-.7}
 const l=Math.hypot(dx,dy)||1;J.push({x:pl.x,y:pl.y-14,vx:dx/l*430,vy:dy/l*430,t:0});ink--;if(!seen){seen=1;try{localStorage.setItem(HK,'1')}catch(e){}}
 sfx.throw();burst(pl.x,pl.y-14,hue(pl.y),5,120,200,2);
}
function press(){if(st==='title')st='play'}
addEventListener('keydown',e=>{
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;k[e.code]=1;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jq=.12;
 if(e.code==='KeyM'){setMute(mute?0:1);return}
 if(e.code==='KeyR'){init();st='play';return}
 if(st==='clear'){if(e.code==='Enter'){init();st='play'}return}
 if(st!=='play'){press();return}
 if(e.code==='KeyZ'||e.code==='KeyX')throwInk();
});
addEventListener('keyup',e=>k[e.code]=0);
// 画面操作: 押したまま横ドラッグ=移動 / 上へフリック=ジャンプ / ちょんと触れる(タップ)=その方向へインク。マウスはクリックで即インク
const tp={};
function aim(e){const b=cv.getBoundingClientRect(),sx=W/b.width,sy=H/b.height;throwInk((e.clientX-b.left)*sx-pl.x,(e.clientY-b.top)*sy+cam-(pl.y-14))}
function mv(){let m=0;for(const id in tp)if(tp[id].mv)m=tp[id].mv;pad.l=m<0?1:0;pad.r=m>0?1:0}
cv.addEventListener('pointerdown',e=>{
 if(st!=='play'){press();return}
 if(e.pointerType==='mouse'){aim(e);return}
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 tp[e.pointerId]={sx:e.clientX,ox:e.clientX,oy:e.clientY,h:[],t0:performance.now(),mv:0,far:0};
});
cv.addEventListener('pointermove',e=>{const t=tp[e.pointerId];if(!t){if(e.pointerType==='mouse')cv.style.cursor=btAt(e)?'pointer':'';return}
 const now=performance.now();
 if(Math.hypot(e.clientX-t.ox,e.clientY-t.oy)>12)t.far=1;
 let dx=e.clientX-t.sx;const R=14; // 基準点は指に追従する(最大14px遅れ)ので、向きを変えると約19pxで即反転
 if(dx>R){t.sx=e.clientX-R;dx=R}else if(dx<-R){t.sx=e.clientX+R;dx=-R}
 t.mv=Math.abs(dx)>5?Math.sign(dx):0;
 // 上フリック: 直近160msの最下点より16px以上上へ動いたらジャンプ(ゆっくりのズレでは暴発しない)
 const h=t.h;h.push([e.clientY,now]);while(h.length&&now-h[0][1]>160)h.shift();
 let lo=-1e9;for(const q of h)if(q[0]>lo)lo=q[0];
 if(lo-e.clientY>16){t.h=[[e.clientY,now]];jq=.18;pad.j=1;setTimeout(()=>pad.j=0,170)}
 mv();
});
const up=e=>{const t=tp[e.pointerId];if(!t)return;delete tp[e.pointerId];mv();
 if(e.type==='pointerup'&&!t.far&&performance.now()-t.t0<260&&st==='play')aim(e)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
// クリア画面のボタン: [x,y,w,h]。シェアはXの投稿画面を開く(タイム・ハッシュタグ・URL入り)
const BT={share:[70,380,340,48],retry:[70,438,340,48]},GAME_URL='https://aki-kaz.github.io/inklimber/',TAG='インクライマー';
function btAt(e){if(st!=='clear')return'';const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height-(H-720)/2;
 for(const n in BT){const r=BT[n];if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3])return n}return''}
function shareX(){const t='インクライマーを'+time.toFixed(1)+'秒で登頂！'+(newRec?'（自己ベスト更新）':'')+'\n'+GAME_URL+'\n#'+TAG,
 u='https://x.com/intent/post?text='+encodeURIComponent(t);
 window.open(u,'_blank','noopener')}
cv.addEventListener('click',e=>{const b=btAt(e);if(b==='share')shareX();else if(b==='retry'){init();st='play'}});
document.querySelectorAll('#pad button[data-k]').forEach(b=>{
 const n=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();pad[n]=1;if(n==='j')jq=.12;if(st!=='play')press()});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>pad[n]=0));
});

function update(dt){
 time+=dt;
 if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
 const ax=((k.ArrowRight||k.KeyD||pad.r)?1:0)-((k.ArrowLeft||k.KeyA||pad.l)?1:0);
 pl.inv-=dt;pl.sq-=dt;jq-=dt;
 if(pl.kb>0)pl.kb-=dt;else{pl.vx=ax*170;if(ax)pl.face=ax}
 // つかまり: 足場の端に手が届くとぶら下がる。ジャンプで引き上げ / 逆方向か下で離す / 放置でずり落ちる
 if(pl.hang){const h=pl.hang;pl.hangT-=dt;pl.vx=0;pl.vy=36;pl.x=h.p.x+(h.s<0?-5:h.p.w+5);
  if(ax===h.s||k.ArrowDown||k.KeyS||pl.hangT<=0){pl.hang=0;pl.noGrab=.3;pl.vy=0}
  else if(jq>0){pl.hang=0;pl.noGrab=.3;pl.vy=-500;pl.x=h.p.x+(h.s<0?8:h.p.w-8);jq=0;sfx.jump();ring(pl.x,h.p.y,hue(h.p.y),44,2);burst(pl.x,h.p.y-2,hue(h.p.y),8,160,300,2)}}
 else pl.noGrab-=dt;
 pl.coy=pl.on?.08:pl.coy-dt;
 if((k.Space||k.ArrowUp||k.KeyW||pad.j)&&pl.coy>0){pl.vy=-530;pl.coy=0;pl.on=0;sfx.jump();dust(pl.x,pl.y,4)}
 pl.vy+=pl.hang?0:1400*dt;const py=pl.y,was=pl.on,v0=pl.vy;
 pl.x=Math.max(8,Math.min(W-8,pl.x+pl.vx*dt));pl.y+=pl.vy*dt;pl.on=0;
 if(pl.vy>=0)for(const p of P){const sp=surf(p,pl.x);if(pl.x+6>p.x&&pl.x-6<p.x+p.w&&py<=sp+6&&(pl.y>=sp||(was&&pl.y>=sp-5))){
  pl.y=sp;pl.vy=0;pl.on=1;
  if(!was)land(p,v0);
  if(p===P[0]){if(pl.minY<-150){falls++;combo=0;shake=Math.max(shake,9);hs=Math.max(hs,.06);sfx.thud();burst(pl.x,-4,220,14,220,700,3)}pl.minY=0}
  if(p===P[P.length-1]){st='clear';celebrate();newRec=!rec.t||time<rec.t;if(newRec)rec.t=+time.toFixed(1);rec.m=Math.max(rec.m,360);saveRec()}
  break}}
 pl.minY=Math.min(pl.minY,pl.y);
 if(!pl.hang&&!pl.on&&pl.vy>0&&pl.noGrab<=0)for(const p of P){if(p===P[0])continue;const hy=pl.y-20;if(hy<p.y-50||hy>p.y+50)continue;
  const s=pl.face>0?-1:1,ex=s<0?p.x:p.x+p.w,d=(pl.x-ex)*s,ee=surf(p,ex);
  if(d>-2&&d<14&&hy>=ee-4&&hy<=ee+12){pl.hang={p,s};pl.hangT=1.1;pl.vx=0;pl.vy=0;pl.y=ee+20;pl.x=ex+s*5;const hh=hue(p.y);
   paint(p,s<0?0:p.n-1);ring(pl.x,ee,hh,44,2);burst(pl.x,ee-2,hh,10,180,400,2);sfx.found();shake=Math.max(shake,3);hs=Math.max(hs,.04);break}}
 best=Math.max(best,Math.round(-pl.y/10));
 if(best>rec.m){rec.m=best;saveRec()}if(!seen&&hintT<0&&pl.y<-720&&ink>0)hintT=time;
 // 旗を立てた足場より大きく落ちたら、その足場からやり直し(旗の高さが新しい地面になる)
 if(cpN&&pl.y>cpY+140){
  falls++;combo=0;chain=0;shake=Math.max(shake,9);hs=Math.max(hs,.06);sfx.thud();
  burst(pl.x,pl.y,220,16,240,700,3);pl.x=cpX;pl.y=cpY;pl.vx=0;pl.vy=0;pl.on=1;pl.kb=0;pl.minY=cpY;
  ring(cpX,cpY,hue(cpY),70,3);dust(cpX,cpY,8)}
 // 合目を越えた瞬間の演出
 const hn=Math.min(10,Math.floor(Math.max(0,-pl.y)/360));
 if(hn>hm){hm=hn;fl=.5;sfx.peak(hm);ring(pl.x,pl.y,hue(pl.y),110,3);ring(pl.x,pl.y,hue(pl.y)+50,70,2);burst(pl.x,pl.y-20,hue(pl.y),16,300,200,3)}
 for(const e of E){if(!e.alive)continue;
  e.x+=e.d*38*dt;if(e.x<e.p.x+8||e.x>e.p.x+e.p.w-8)e.d*=-1;e.y=surf(e.p,e.x);
  paint(e.p,Math.floor((e.x-e.p.x)/T));
  if(Math.abs(pl.x-e.x)<13&&pl.y>e.y-16&&pl.y-22<e.y){
   if(pl.vy>0&&py<=e.y-8){e.alive=0;pl.vy=-380;I.push({x:e.x,y:e.y-14,t:Math.random()*6});
    chain++;sfx.stomp(chain-1);burst(e.x,e.y-8,270,20,280,800,3);hs=Math.max(hs,.07);shake=Math.max(shake,4);
    if(chain>=2)pop('chev',e.x,e.y-34,300,Math.min(chain,5))}
   else if(pl.inv<=0){pl.inv=.8;pl.kb=.3;pl.vx=(pl.x<e.x?-1:1)*260;pl.vy=-260;
    chain=0;sfx.hit();burst(pl.x,pl.y-10,0,12,200,700,3);shake=Math.max(shake,8);hs=Math.max(hs,.08)}
  }}
 for(const it of I){it.t+=dt;if(!it.got&&Math.hypot(pl.x-it.x,pl.y-11-it.y)<18){it.got=1;ink=Math.min(9,ink+1);if(!seen&&hintT<0)hintT=time;
  sfx.item();burst(it.x,it.y,hue(it.y),8,160,500,2);pop('drop',it.x,it.y-18,hue(it.y),1)}}
 I=I.filter(i=>!i.got);
 for(const j of J){const oy=j.y;j.t+=dt;j.vy+=650*dt;j.x=Math.max(0,Math.min(W,j.x+j.vx*dt));j.y+=j.vy*dt;
  Q.push({x:j.x,y:j.y,vx:0,vy:0,l:0,m:.25,h:hue(j.y),s:3,g:0});
  if(j.vy>0)for(const p of P){const sp=surf(p,j.x);if(j.x>=p.x&&j.x<=p.x+p.w&&oy<=sp&&j.y>=sp){splash(j.x,sp);j.dead=1;break}}
  if(!j.dead&&j.y>40)j.dead=1}
 J=J.filter(j=>!j.dead);
 for(const d of D){const oy=d.y;d.vy+=500*dt;d.y+=d.vy*dt;d.len+=d.y-oy;
  px.strokeStyle=`hsla(${d.h},90%,55%,.9)`;px.lineWidth=2.5;px.beginPath();px.moveTo(d.x,oy+OFF);px.lineTo(d.x,d.y+OFF);px.stroke();
  for(const p of P)if(surf(p,d.x)>oy&&surf(p,d.x)<=d.y&&d.x>=p.x&&d.x<=p.x+p.w){
   const i=Math.floor((d.x-p.x)/T);paint(p,i-1);paint(p,i);paint(p,i+1);d.dead=1;break}
  if(d.len>320)d.dead=1;}
 D=D.filter(d=>!d.dead);
 cam=Math.min(-(H-120),cam+((pl.y-Math.round(H*.65))-cam)*Math.min(1,dt*6));
}
// 見た目だけの更新(波紋の塗り広がり・粒・リング・ポップアップ)
function fx(dt){
 for(const r of RP){r.r+=220*dt;const m=Math.min(r.r,58);
  for(const p of P)if(Math.abs(p.y-r.y)<m+40)for(let i=0;i<p.n;i++){const tx=p.x+i*T+T/2,ty=surf(p,tx);
   if(Math.hypot(tx-r.x,ty-r.y)<m&&paint(p,i)){r.n++;
    Q.push({x:tx,y:ty-2,vx:(Math.random()-.5)*40,vy:-70-Math.random()*70,l:0,m:.45,h:hue(p.y),s:3,g:260})}}
  if(r.r>=58)r.dead=1}
 RP=RP.filter(r=>!r.dead);
 for(const q of Q){q.l+=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}Q=Q.filter(q=>q.l<q.m);
 for(const g of G)g.t+=dt;G=G.filter(g=>g.t<g.d);
 for(const f of F){f.t+=dt;f.y-=36*dt}F=F.filter(f=>f.t<f.d);
 if(fl>0)fl-=dt;
 if(st==='clear'&&Math.random()<.6)Q.push({x:Math.random()*W,y:cam-10,vx:(Math.random()-.5)*60,vy:60+Math.random()*80,l:0,m:2.2,h:Math.random()*360,s:4+Math.random()*4,g:120});
}

function txt(s,x,y,sz,c){ctx.fillStyle=c||'#222';ctx.font=`bold ${sz}px ${FONT}`;ctx.fillText(s,x,y)}
// 山肌の背景: 遠景の山並み(視差で沈む)・斜めの岩の地層線・両端の岩壁。白を邪魔しない淡さで、色相だけ高度でゆっくり変わる
function bg(){
 const a=-cam,hh=hue(pl.y);
 for(let L=0;L<3;L++){const b=430+(H-720)+L*70+(a-(H-120))*(.05+L*.04);if(b>H+120)continue;
  ctx.fillStyle=`hsla(${hh+L*25},35%,${80-L*3}%,.3)`;ctx.beginPath();ctx.moveTo(-12,H);
  for(let x=-12;x<=W+12;x+=24)ctx.lineTo(x,b-34-L*10-26*Math.abs(Math.sin(x*.011+L*2.3))-14*Math.sin(x*.037+L));
  ctx.lineTo(W+12,H);ctx.fill()}
 ctx.strokeStyle=`hsla(${hh},25%,55%,.12)`;ctx.lineWidth=1.5;
 for(let j=Math.floor((cam-60)/70);j*70<cam+H+60;j++){const wy=j*70-cam,o=((j*37)%5+5)%5*5;
  ctx.setLineDash([40+((j*13)%50+50)%50,30+((j*7)%40+40)%40]);ctx.beginPath();ctx.moveTo(-12,wy+26+o);ctx.lineTo(W+12,wy-26+o);ctx.stroke()}
 ctx.setLineDash([]);
 for(const s of [0,1]){ctx.fillStyle=`hsla(${hh},20%,60%,.16)`;ctx.beginPath();ctx.moveTo(s?W+12:-12,-10);
  for(let y=-10;y<=H+10;y+=20){const wy=y+cam,e=4+4*Math.sin(wy*.021+s*2)+3*Math.sin(wy*.063+s);ctx.lineTo(s?W-e:e,y)}
  ctx.lineTo(s?W+12:-12,H+10);ctx.fill()}
}
// 初回だけ出すヒント: 点線の軌道を雫が飛び、タップ位置に輪が脈打つ(文字なし)。一度投げたら二度と出ない
function hintThrow(){
 const u=Math.min(1,(time-hintT)*2),f=(time*1.6)%1,c=`hsl(${hue(pl.y)},90%,50%)`,d=pl.x<W/2?1:-1,
  x0=pl.x,y0=pl.y-cam-14,x1=pl.x+d*110,y1=y0-10,q=u=>[x0+(x1-x0)*u,y0+(y1-y0)*u-Math.sin(u*Math.PI)*60];
 ctx.save();ctx.globalAlpha=.9*u;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.beginPath();
 for(let t=0;t<=1.001;t+=.05){const[a,b]=q(t);t?ctx.lineTo(a,b):ctx.moveTo(a,b)}ctx.stroke();ctx.setLineDash([]);
 const[bx,by]=q(f);ctx.beginPath();ctx.arc(bx,by,5,0,7);ctx.fill();
 ctx.globalAlpha=.3*u;ctx.beginPath();ctx.arc(x1,y1,9,0,7);ctx.fill();
 ctx.globalAlpha=.9*u*(1-f);ctx.lineWidth=3;ctx.beginPath();ctx.arc(x1,y1,10+f*16,0,7);ctx.stroke();ctx.restore();

 ctx.beginPath();ctx.arc(x,y-h*.78,w*.47,0,7);ctx.fill();ctx.beginPath();ctx.arc(x-f*w*.28,y-h*1.02,w*.17,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.fillRect(x+(f>0?w*.1:-w*.3),y-h*.82,w*.2,h*.1);
}
function drawEnemy(x,y,d){
 // 頭の上に大きな目(=弱点)。上は丸くてトゲなし。トゲは両脇だけ=横からぶつかると痛い
 ctx.fillStyle='#3a2f4a';ctx.beginPath();ctx.moveTo(x-13,y);ctx.quadraticCurveTo(x-15,y-13,x,y-15);ctx.quadraticCurveTo(x+15,y-13,x+13,y);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(x-12,y-11);ctx.lineTo(x-21,y-6);ctx.lineTo(x-13,y-3);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(x+12,y-11);ctx.lineTo(x+21,y-6);ctx.lineTo(x+13,y-3);ctx.closePath();ctx.fill();
 const pu=1+.07*Math.sin(performance.now()/170);
 ctx.fillStyle='#fff';ctx.strokeStyle='#3a2f4a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-14,6.5*pu,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle='#d33';ctx.beginPath();ctx.arc(x+d*1.5,y-14,3.2,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+d*1.5-1,y-15.2,1,0,7);ctx.fill();
}
function render(){
 ctx.setTransform(S,0,0,S,0,0);ctx.globalAlpha=1;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
 bg();ctx.drawImage(pc,0,cam+OFF,W,H,0,0,W,H);
 if(-cam<H){ctx.fillStyle='#2b2f3a';ctx.fillRect(-12,-cam,W+24,H+cam+12)}
 const fy=TOP-cam;ctx.fillStyle='#d33';ctx.fillRect(W/2,fy-48,3,48);ctx.fillRect(W/2+3,fy-48,26,16);
 ctx.textAlign='center';txt('頂',W/2-18,fy-30,16,'#d33');
 // 合目の目印: 壁に刻まれた点線と点の数(n合目=n個)。越えると色づく
 for(let n=1;n<=9;n++){const wy=-n*360,sy=wy-cam;if(sy<-20||sy>H+20)continue;
  const on=hm>=n,c=on?`hsl(${hue(wy)},85%,50%)`:'#c3c8d3';
  ctx.globalAlpha=on?.55:.4;ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();ctx.setLineDash([]);
  ctx.globalAlpha=1;ctx.fillStyle=c;for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(9+i*7,sy-7,2.2,0,7);ctx.fill()}}
 // ベースキャンプの旗: 足場は見えなくても旗だけは遠くから見える目印。到達すると色づく
 for(const p of P)if(p.cp){const sy=p.y-cam;if(sy<-60||sy>H+60)continue;
  const mx=p.x+p.w/2;icon('flag',mx,sy-18,18,p.act?`hsl(${hue(p.y)},85%,50%)`:'#b4bac7',!p.act)}
 for(const it of I){const y=it.y-cam+Math.sin(it.t*3)*3;ctx.fillStyle=`hsl(${hue(it.y)},90%,50%)`;ctx.beginPath();ctx.arc(it.x,y,7,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(it.x-3,y-11,6,5)}
 for(const e of E)if(e.alive)drawEnemy(e.x,e.y-cam,e.d);
 // 着地・着弾のリング(足場に沿う楕円)
 for(const g of G){const u=g.t/g.d,e=1-(1-u)*(1-u),a=1-u;
  ctx.strokeStyle=`hsla(${g.h},90%,50%,${a})`;ctx.lineWidth=g.lw*a+1;
  ctx.beginPath();ctx.ellipse(g.x,g.y-cam,g.m*e,g.m*.28*e,0,0,7);ctx.stroke()}
 // 粒
 for(const q of Q){ctx.globalAlpha=Math.max(0,1-q.l/q.m);ctx.fillStyle=q.c||`hsl(${q.h},90%,55%)`;ctx.fillRect(q.x-q.s/2,q.y-cam-q.s/2,q.s,q.s)}
 ctx.globalAlpha=1;
 for(const j of J){ctx.fillStyle=`hsl(${hue(j.y)},90%,50%)`;ctx.beginPath();ctx.arc(j.x,j.y-cam,5,0,7);ctx.fill()}
 if(!(pl.inv>0&&Math.floor(time*20)%2)){
  const y=pl.y-cam,q=Math.max(0,pl.sq)*2,w=12*(1+q),h=22*(1-q);
  drawPlayer(pl.x,y,w,h,pl.face);
  if(pl.hang){const hp=pl.hang.p,hx=pl.hang.s<0?hp.x:hp.x+hp.w,hy=surf(hp,hx)-cam;ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pl.x,y-h+6);ctx.lineTo(hx,hy);ctx.stroke();
   ctx.fillStyle=`hsl(${hue(hp.y)},90%,52%)`;ctx.beginPath();ctx.arc(hx,hy,4,0,7);ctx.fill()}}
 if(!seen&&st==='play'&&hintT>=0&&ink>0)hintThrow();
 // ポップアップ文字
 ctx.textAlign='center';ctx.lineJoin='round';
 for(const f of F){const u=f.t/f.d,s=1+Math.max(0,.18-f.t)*3.5,c=`hsl(${f.h},85%,50%)`,y=f.y-cam;
  ctx.globalAlpha=Math.max(0,Math.min(1,(1-u)*3));
  if(f.ic==='star')for(let i=0;i<f.n;i++)icon('star',f.x+(i-(f.n-1)/2)*18,y-(i%2)*7,(f.n>1?9:11)*s,c);
  else if(f.ic==='chev')for(let i=0;i<f.n;i++)icon('chev',f.x,y-i*7,7*s,c);
  else icon(f.ic,f.x,y,(f.ic==='flag'?15:7)*s,c)}
 ctx.globalAlpha=1;
 ctx.restore();
 if(fl>0){ctx.fillStyle=`hsla(${hue(pl.y)},90%,60%,${Math.min(.2,fl*.3)})`;ctx.fillRect(0,0,W,H)}
 if(st!=='title')gauge();
 // HUD(シェイクの影響を受けない)
 // インクは雫アイコンの数、落下は矢印+回数。文字ラベルは使わない
 const ic=`hsl(${hue(pl.y)},90%,50%)`;
 for(let i=0;i<Math.max(2,ink);i++)icon('drop',16+i*17,20,7,ink<=0?`hsl(0,80%,${50+Math.sin(time*12)*8}%)`:ic,i>=ink);
 icon('down',15,46,6,'#6b7280');ctx.textAlign='left';txt(String(falls),27,51,13,'#6b7280');
 if(combo>=2){ctx.textAlign='right';txt('×'+combo,W-44,40,18+Math.min(combo,10)*2,`hsl(${(time*300)%360},85%,45%)`)}
 ctx.textAlign='center';
 if(st==='title'||st==='clear'){ctx.save();ctx.translate(0,(H-720)/2);
  ctx.fillStyle='rgba(255,255,255,.9)';if(st==='clear')ctx.fillRect(30,190,W-60,310);else ctx.fillRect(30,428,W-60,112);
  if(st==='title'){if(LG.complete&&LG.naturalWidth){const lw=410,lh=lw*LG.naturalHeight/LG.naturalWidth;ctx.drawImage(LG,W/2-lw/2,238-lh/2,lw,lh)}
   if(rec.m>0)txt('最高 '+rec.m+'m'+(rec.t?'　ベスト '+rec.t.toFixed(1)+'s':''),W/2,364,13,'#6b7280');
   ctx.globalAlpha=.75+.25*Math.sin(performance.now()/300);txt('タップ/クリック でスタート',W/2,398,17,'#d33');ctx.globalAlpha=1;
   ['足場をたどって、頂上をめざそう','見えない足場もある。インクを投げて、存在を確かめよう','インクは敵を踏むと手に入る'].forEach((t,i)=>txt(t,W/2,452+i*32,14,'#444'));
   if(TOUCH()){ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(30,552,W-60,104);['ドラッグ：左右に移動','上へフリック：ジャンプ','タップ：タップした方向にインクを投げる'].forEach((t,i)=>txt(t,W/2,580+i*30,14,'#444'))}}
  else{txt('登頂成功！',W/2,246,32,'#d33');txt(time.toFixed(1)+'s',W/2,298,26);txt(newRec?'NEW RECORD':'ベスト '+rec.t.toFixed(1)+'s',W/2,320,13,newRec?'#d33':'#6b7280');
   // 結果はアイコン+数字: 手探り着地(星) / 旗 / 落下(矢印)
   [['star',blind,'#e0a800'],['flag',cpN,'#d33'],['down',falls,'#6b7280']].forEach(([t,v,c],i)=>{const x=W/2-90+i*90;icon(t,x-14,344,11,c);ctx.textAlign='left';txt(String(v),x+2,350,20);});
   ctx.textAlign='center';
   [['share','結果をXでシェア！','#111'],['retry','もう一度プレイ！','#d33']].forEach(([n,l,c])=>{const r=BT[n];ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(r[0],r[1],r[2],r[3],12);else ctx.rect(r[0],r[1],r[2],r[3]);ctx.fill();txt(l,W/2,r[1]+r[3]/2+6,18,'#fff')})}
 ctx.restore()}
}
// 標高ゲージ(右端): 目盛り=合目、旗=ベースキャンプ、色の帯=自分が塗った高さ、三角=最高到達点、丸=現在地
function gauge(){
 const gx=W-20,y0=72,y1=H-26,L=y1-y0,fy=v=>y1-Math.max(0,Math.min(1,v/3600))*L;
 ctx.fillStyle='rgba(255,255,255,.62)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(gx-17,y0-16,34,L+32,14);else ctx.rect(gx-17,y0-16,34,L+32);ctx.fill();
 ctx.lineCap='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.moveTo(gx,y1);ctx.lineTo(gx,y0);ctx.stroke();
 for(const p of P){if(!p.c||p.cp)continue;const w=3+8*Math.min(1,p.c/p.n);ctx.fillStyle=`hsl(${hue(p.y)},85%,52%)`;ctx.fillRect(gx-w/2,fy(-p.y)-1.5,w,3)}
 for(let n=1;n<10;n++){const y=fy(n*360),on=hm>=n;ctx.strokeStyle=on?`hsl(${hue(-n*360)},80%,45%)`:'rgba(0,0,0,.3)';ctx.lineWidth=n===5?2.5:1.5;
  ctx.beginPath();ctx.moveTo(gx-(n===5?14:11),y);ctx.lineTo(gx-5,y);ctx.stroke()}
 for(const p of P)if(p.cp)icon('flag',gx+1,fy(-p.y)-4,6,p.act?`hsl(${hue(p.y)},85%,48%)`:'#9aa1b0',!p.act);
 icon('flag',gx+1,y0-8,8,'#d33');
 const by=fy(best*10);ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.moveTo(gx-16,by-4);ctx.lineTo(gx-16,by+4);ctx.lineTo(gx-10,by);ctx.fill();
 const cy=fy(-pl.y);ctx.fillStyle=`hsl(${hue(pl.y)},90%,55%)`;ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx,cy,6,0,7);ctx.fill();ctx.stroke();
}
function frame(t){requestAnimationFrame(frame);if(!(fc++%20))layout();const dt=Math.min(.033,(t-last)/1000||0);last=t;
 shake*=Math.exp(-dt*12);if(shake<.2)shake=0;
 if(hs>0)hs-=dt; // ヒットストップ中は世界を止める(描画とシェイクだけ動く)
 else{if(st==='play')update(dt);fx(dt)}
 render()}
showRec();layout();init();requestAnimationFrame(frame);
